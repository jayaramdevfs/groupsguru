spring:
  application:
    name: groupsguru

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native

jwt:
  secret: ${JWT_SECRET:#{null}}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  storage:
    location: ./uploads
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://groupsguru.in,http://localhost:3006}
  auth:
    cookie:
      secure: ${APP_AUTH_COOKIE_SECURE:false}
      same-site: ${APP_AUTH_COOKIE_SAME_SITE:Lax}
      domain: ${APP_AUTH_COOKIE_DOMAIN:}
razorpay:
  key-id: ${RAZORPAY_KEY_ID:#{null}}
  key-secret: ${RAZORPAY_KEY_SECRET:#{null}}
