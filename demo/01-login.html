<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GroupsGuru — Login</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0f051d;
  color: #FFFFFF;
  font-family: system-ui, -apple-system, sans-serif;
  font-weight: 600;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
body::before {
  content: '';
  position: absolute;
  top: -40%; left: -20%;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(147,51,234,0.15) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
body::after {
  content: '';
  position: absolute;
  bottom: -30%; right: -10%;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(79,70,229,0.12) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.lang-toggle {
  position: absolute;
  top: 24px; right: 28px;
  display: flex; gap: 4px;
  background: rgba(147,51,234,0.08);
  border: 1px solid rgba(147,51,234,0.2);
  border-radius: 12px;
  padding: 6px 4px;
  z-index: 10;
}
.lang-toggle button {
  background: none;
  border: none;
  color: rgba(255,255,255,0.6);
  font-weight: 600;
  font-size: 13px;
  padding: 4px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
.lang-toggle button.active {
  background: linear-gradient(135deg, #9333EA, #4f46e5);
  color: #fff;
}
.login-card {
  background: rgba(147,51,234,0.08);
  border: 1px solid rgba(147,51,234,0.2);
  border-radius: 32px;
  padding: 48px 40px;
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 5;
  backdrop-filter: blur(20px);
}
.logo {
  font-size: 32px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 4px;
  background: linear-gradient(135deg, #9333EA, #4f46e5);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.tagline {
  text-align: center;
  color: rgba(255,255,255,0.6);
  font-size: 14px;
  margin-bottom: 36px;
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 8px;
}
.form-group input {
  width: 100%;
  padding: 14px 16px;
  background: #0f071a;
  border: 1px solid rgba(147,51,234,0.2);
  border-radius: 14px;
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
.form-group input::placeholder {
  color: rgba(255,255,255,0.3);
}
.form-group input:focus {
  border-color: #9333EA;
}
.btn-primary {
  display: block;
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #9333EA, #4f46e5);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  font-family: inherit;
  margin-top: 28px;
  transition: transform 0.15s, box-shadow 0.2s;
  text-decoration: none;
  text-align: center;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(147,51,234,0.35);
}
.register-link {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
  color: rgba(255,255,255,0.6);
}
.register-link a {
  color: #9333EA;
  text-decoration: none;
  font-weight: 700;
}
.register-link a:hover { text-decoration: underline; }
@media (max-width: 480px) {
  .login-card { margin: 20px; padding: 36px 24px; }
}
</style>
</head>
<body>
<div class="lang-toggle">
  <button class="active">EN</button>
  <button>తెలుగు</button>
</div>
<div class="login-card">
  <div class="logo">GroupsGuru</div>
  <div class="tagline">APPSC Exam Preparation</div>
  <div class="form-group">
    <label>Email Address</label>
    <input type="email" placeholder="you@example.com">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" placeholder="Enter your password">
  </div>
  <a href="02-dashboard.html" class="btn-primary">Login</a>
  <div class="register-link">New here? <a href="#">Register</a></div>
</div>
</body>
</html>
