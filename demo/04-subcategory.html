<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GroupsGuru — History</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0f051d;
  color: #FFFFFF;
  font-family: system-ui, -apple-system, sans-serif;
  font-weight: 600;
  min-height: 100vh;
}
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px;
  border-bottom: 1px solid rgba(147,51,234,0.1);
}
.topbar-logo {
  font-size: 22px; font-weight: 800;
  background: linear-gradient(135deg, #9333EA, #4f46e5);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; text-decoration: none;
}
.topbar-right { display: flex; align-items: center; gap: 16px; }
.lang-toggle {
  display: flex; gap: 4px;
  background: rgba(147,51,234,0.08);
  border: 1px solid rgba(147,51,234,0.2);
  border-radius: 10px; padding: 4px;
}
.lang-toggle button {
  background: none; border: none;
  color: rgba(255,255,255,0.6);
  font-weight: 600; font-size: 12px;
  padding: 4px 10px; border-radius: 7px;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.lang-toggle button.active {
  background: linear-gradient(135deg, #9333EA, #4f46e5); color: #fff;
}
.profile-icon {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #9333EA, #DB2777);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; cursor: pointer;
}
.container { max-width: 960px; margin: 0 auto; padding: 28px 24px; }
.breadcrumb {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: rgba(255,255,255,0.5);
  margin-bottom: 24px; flex-wrap: wrap;
}
.breadcrumb a { color: rgba(255,255,255,0.5); text-decoration: none; transition: color 0.2s; }
.breadcrumb a:hover { color: #9333EA; }
.breadcrumb .sep { opacity: 0.4; }
.breadcrumb .current { color: #fff; }
.page-header { font-size: 28px; font-weight: 800; margin-bottom: 28px; }
.section-grid {
  display: grid; grid-template-columns: 1fr; gap: 18px;
  max-width: 680px;
}
.section-card {
  background: rgba(147,51,234,0.08);
  border: 1px solid rgba(147,51,234,0.2);
  border-radius: 32px;
  padding: 32px 28px;
  text-decoration: none; color: #fff;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  display: flex; align-items: flex-start; gap: 20px;
}
.section-card:hover {
  transform: translateY(-4px) scale(1.01);
  box-shadow: 0 12px 40px rgba(147,51,234,0.2);
  border-color: rgba(147,51,234,0.45);
}
.section-icon { font-size: 36px; flex-shrink: 0; }
.section-info { flex: 1; }
.section-info h3 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
.section-info .desc { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
.section-info .count { font-size: 12px; color: #9333EA; font-weight: 700; }
@media (max-width: 640px) {
  .container { padding: 20px 16px; }
}
</style>
</head>
<body>
<div class="topbar">
  <a href="02-dashboard.html" class="topbar-logo">GroupsGuru</a>
  <div class="topbar-right">
    <div class="lang-toggle">
      <button class="active">EN</button>
      <button>తెలుగు</button>
    </div>
    <div class="profile-icon">S</div>
  </div>
</div>
<div class="container">
  <div class="breadcrumb">
    <a href="02-dashboard.html">Dashboard</a>
    <span class="sep">›</span>
    <a href="03-category.html">G1 Prelims</a>
    <span class="sep">›</span>
    <span class="current">History</span>
  </div>
  <h1 class="page-header">History</h1>
  <div class="section-grid">
    <a href="05-section.html" class="section-card">
      <div class="section-icon">🏛️</div>
      <div class="section-info">
        <h3>Ancient India</h3>
        <div class="desc">Prehistoric Period to Gupta Empire</div>
        <div class="count">30 MCQs</div>
      </div>
    </a>
    <a href="05-section.html" class="section-card">
      <div class="section-icon">🏰</div>
      <div class="section-info">
        <h3>Medieval India</h3>
        <div class="desc">Delhi Sultanate to Mughal Empire</div>
        <div class="count">25 MCQs</div>
      </div>
    </a>
    <a href="05-section.html" class="section-card">
      <div class="section-icon">🇮🇳</div>
      <div class="section-info">
        <h3>Modern India</h3>
        <div class="desc">British Rule to Independence</div>
        <div class="count">30 MCQs</div>
      </div>
    </a>
  </div>
</div>
</body>
</html>
